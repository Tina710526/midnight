<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午夜 11:11</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050505;color:#eee;font-family:Arial,"Noto Sans TC",sans-serif}
#game{width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:20px;width:100%;text-align:center;letter-spacing:8px;font-size:20px;color:#c8b9b0}
#info{position:absolute;left:25px;top:70px;line-height:2;font-size:14px;text-shadow:0 2px 5px #000}
#hint{position:absolute;bottom:15%;width:100%;text-align:center;color:#ddd;text-shadow:0 2px 8px #000}
#cross{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%)}
#screen{position:fixed;inset:0;background:radial-gradient(#222,#000);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
.panel{max-width:550px;padding:35px}
h1{font-size:48px;letter-spacing:8px;color:#a52c36}
button{padding:14px 35px;background:#54151d;border:1px solid #9b414b;color:white;cursor:pointer;font-size:16px}
button:hover{background:#8a2633}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
  <div id="title">MIDNIGHT 11:11</div>
  <div id="info">
    記憶碎片：<span id="count">0 / 3</span><br>
    手電筒：<span id="light">開啟</span><br>
    <span id="objective">找到三張記憶碎片</span>
  </div>
  <div id="cross"></div>
  <div id="hint"></div>
</div>
<div id="screen">
  <div class="panel">
    <h1>午夜 11:11</h1>
    <p>十年前失火的老宅，今晚卻亮著燈。</p>
    <p>找到三張記憶碎片，解開地下室的秘密。</p>
    <p>不要讓她找到你。</p>
    <button id="start">進入老宅</button>
    <p style="font-size:12px;line-height:2;color:#888">
      WASD 移動｜滑鼠環視｜Shift 奔跑<br>
      E 調查｜F 手電筒｜ESC 暫停
    </p>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050609);
scene.fog=new THREE.FogExp2(0x090a0e,.045);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.6,7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.querySelector("#game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x777788,0x171010,.25));

const moon=new THREE.DirectionalLight(0x65718d,.35);
moon.position.set(-5,9,5);
moon.castShadow=true;
scene.add(moon);

const flashlight=new THREE.SpotLight(0xe0e5ed,35,18,Math.PI/7,.5,1.5);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

const material=(color,roughness=1)=>
new THREE.MeshStandardMaterial({color,roughness});

const wall=material(0x29272a);
const floor=material(0x282321);
const wood=material(0x38251f);
const dark=material(0x08080b);

function cube(x,y,z,w,h,d,mat){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 obj.position.set(x,y,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
 return obj;
}

function room(x,z,w,d){
 cube(x,-.15,z,w,.3,d,floor);
 cube(x,3,z,w,.2,d,dark);
 cube(x-w/2,1.5,z,.2,3,d,wall);
 cube(x+w/2,1.5,z,.2,3,d,wall);
 cube(x,1.5,z-d/2,w,3,.2,wall);
 cube(x,1.5,z+d/2,w,3,.2,wall);
}

// 五個房間
room(0,5,8,8);
room(0,-3,8,8);
room(-8,-3,8,8);
room(8,-3,8,8);
room(0,-11,8,8);

// 走廊
cube(0,-.1,1,3,.2,4,floor);
cube(-4,-.1,-3,4,.2,2,floor);
cube(4,-.1,-3,4,.2,2,floor);
cube(0,-.1,-7,3,.2,2,floor);

// 家具
cube(-2,.7,5,2,.2,.7,wood);
cube(-8,.4,-4,3,.5,2,wood);
cube(-8,.8,-4,2.8,.3,1.8,material(0x514748));
cube(-11,1,-.5,1,2,1,wood);
cube(8,.8,-3,3,.2,1.5,wood);

// 燈光
const lamps=[];
function addLamp(x,y,z){
 const l=new THREE.PointLight(0x884433,1.5,8);
 l.position.set(x,y,z);
 scene.add(l);
 lamps.push(l);
}
addLamp(-2,2.5,5);
addLamp(0,2.5,-3);
addLamp(-8,2.5,-3);
addLamp(8,2.5,-3);
addLamp(0,2.5,-11);

// 記憶碎片
const memories=[];
function addMemory(x,y,z,title,text){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(.35,.05,.25),
  material(0xc8bda6)
 );
 obj.position.set(x,y,z);
 scene.add(obj);
 memories.push({obj,title,text,found:false});
}
addMemory(-2,1.1,5.8,"客廳的紙條",
"媽媽說，十一點以後不可以開門。\n可是小雨一直敲門。");
addMemory(-8,1.1,-4,"妹妹的日記",
"鑰匙藏在餐桌下面。\n姐姐回來了，叫她不要相信鏡子。");
addMemory(8,1.1,-3,"餐廳的照片",
"火不是意外。\n那天晚上，姐姐把門鎖上了。");

// 地下室密碼物件
const keypad=new THREE.Mesh(
 new THREE.BoxGeometry(.6,.9,.1),
 material(0x66513d)
);
keypad.position.set(0,1.2,-13.5);
scene.add(keypad);

// 鬼怪
const ghost=new THREE.Group();
const ghostBody=new THREE.Mesh(
 new THREE.CapsuleGeometry(.35,1,5,8),
 dark
);
ghostBody.position.y=1;
ghost.add(ghostBody);

const ghostHead=new THREE.Mesh(
 new THREE.SphereGeometry(.32,12,10),
 dark
);
ghostHead.position.y=1.8;
ghost.add(ghostHead);

const eyeMaterial=new THREE.MeshBasicMaterial({color:0xc90020});
for(const x of [-.12,.12]){
 const eye=new THREE.Mesh(
  new THREE.SphereGeometry(.04,8,8),
  eyeMaterial
 );
 eye.position.set(x,1.85,-.28);
 ghost.add(eye);
}
ghost.position.set(-8,0,-8);
ghost.visible=false;
scene.add(ghost);

let started=false;
let locked=false;
let keys={};
let yaw=0,pitch=0;
let found=0;
let sanity=100;
let flash=true;
let nearest=null;
let gameOver=false;

function updateHUD(){
 document.querySelector("#count").textContent=found+" / 3";
 document.querySelector("#objective").textContent=
 found===3?"前往地下室輸入密碼":"尋找記憶碎片";
}

function message(text){
 document.querySelector("#hint").textContent=text;
}

function startGame(){
 started=true;
 document.querySelector("#screen").style.display="none";
 renderer.domElement.requestPointerLock();
}

document.querySelector("#start").onclick=startGame;

document.addEventListener("pointerlockchange",()=>{
 locked=document.pointerLockElement===renderer.domElement;
 if(started&&!locked&&!gameOver){
  document.querySelector("#screen").style.display="flex";
  document.querySelector(".panel").innerHTML=
  '<h1>暫停</h1><p>屋子裡的聲音沒有停止。</p><button onclick="location.reload()">重新開始</button>';
 }
});

document.addEventListener("mousemove",e=>{
 if(!locked)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.3,Math.min(1.3,pitch));
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
});

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyF"){
  flash=!flash;
  flashlight.intensity=flash?35:0;
  document.querySelector("#light").textContent=flash?"開啟":"關閉";
 }
 if(e.code==="KeyE")interact();
});
document.addEventListener("keyup",e=>keys[e.code]=false);

renderer.domElement.addEventListener("click",()=>{
 if(started&&!locked&&!gameOver)renderer.domElement.requestPointerLock();
});

const raycaster=new THREE.Raycaster();
function findTarget(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const objects=[
  ...memories.filter(m=>!m.found).map(m=>m.obj),
  keypad
 ];
 const hits=raycaster.intersectObjects(objects);
 return hits.length&&hits[0].distance<2.5?hits[0].object:null;
}

function interact(){
 if(!started||!locked)return;
 const target=findTarget();
 if(!target)return;

 const memory=memories.find(m=>m.obj===target);
 if(memory){
  memory.found=true;
  found++;
  memory.obj.visible=false;
  updateHUD();
  message(memory.title+"："+memory.text.replaceAll("\n"," "));
  if(found===1)ghost.visible=true;
  if(found===3)message("地下室的門打開了。快去找出口。");
  return;
 }
 if(target===keypad){
  if(found<3){
   message("門鎖住了，還有記憶沒有找回。");
   return;
  }
  const code=prompt("輸入四位數密碼");
  if(code==="1024"){
   gameOver=true;
   document.exitPointerLock();
   document.querySelector("#screen").style.display="flex";
   document.querySelector(".panel").innerHTML=
   "<h1>逃出老宅</h1><p>你終於想起那天晚上發生的事。</p><p>午夜 11:11 — END</p><button onclick='location.reload()'>重新開始</button>";
  }else message("密碼錯誤。她聽見了。");
 }
}

// 簡易碰撞
function blocked(x,z){
 return Math.abs(x+2)<1.1&&Math.abs(z-5)<.8;
}

const clock=new THREE.Clock();
let time=0;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 time+=dt;

 lamps.forEach((l,i)=>{
  l.intensity=1.1+Math.sin(time*3+i*2)*.5;
 });

 if(started&&locked&&!gameOver){
  const move=new THREE.Vector3();
  if(keys.KeyW)move.z-=1;
  if(keys.KeyS)move.z+=1;
  if(keys.KeyA)move.x-=1;
  if(keys.KeyD)move.x+=1;
  move.normalize();

  const speed=keys.ShiftLeft?4.2:2.5;
  const dx=(move.x*Math.cos(yaw)+move.z*Math.sin(yaw))*speed*dt;
  const dz=(move.z*Math.cos(yaw)-move.x*Math.sin(yaw))*speed*dt;

  if(!blocked(camera.position.x+dx,camera.position.z))
   camera.position.x+=dx;
  camera.position.z+=dz;

  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-11.5,11.5);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-14,9);
  camera.position.y=1.6;

  flashlight.target.position.set(
   camera.position.x+Math.sin(yaw)*2,
   camera.position.y+Math.sin(pitch)*2,
   camera.position.z-Math.cos(yaw)*2
  );

  nearest=findTarget();
  message(nearest?"按 E 調查":"");

  if(ghost.visible){
   const dx=camera.position.x-ghost.position.x;
   const dz=camera.position.z-ghost.position.z;
   const dist=Math.hypot(dx,dz);
   if(dist>1.2){
    ghost.position.x+=dx/dist*1.1*dt;
    ghost.position.z+=dz/dist*1.1*dt;
   }
   ghost.lookAt(camera.position.x,0,camera.position.z);
   if(dist<5){
    sanity-=dt*2;
    if(sanity<=0){
     gameOver=true;
     document.exitPointerLock();
     document.querySelector("#screen").style.display="flex";
     document.querySelector(".panel").innerHTML=
     "<h1>她找到你了</h1><p>這次，不要再丟下我。</p><button onclick='location.reload()'>重新開始</button>";
    }
   }
  }
 }

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
